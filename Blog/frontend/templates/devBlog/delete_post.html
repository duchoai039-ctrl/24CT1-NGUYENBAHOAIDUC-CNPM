{% extends 'devBlog/base.html' %}

{% block title %}Xóa bài - Perspect{% endblock %}

{% block content %}
<div class="page-narrow">
  <h1 class="page-title">Xóa bài này?</h1>
  <p class="lead">Bài “{{ post.opening|truncatechars:80 }}” sẽ bị xóa cùng toàn bộ bình luận và ảnh. Không thể khôi phục.</p>
  <form method="POST" class="form-actions">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Xóa bài</button>
    <a href="{% url 'post_detail' post.id %}" class="btn btn-secondary">Giữ lại</a>
  </form>
</div>
{% endblock %}
