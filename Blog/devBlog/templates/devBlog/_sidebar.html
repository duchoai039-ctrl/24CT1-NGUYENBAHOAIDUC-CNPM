<!-- Latest Posts -->
<section class="widget">
  <h3>Mới nhất</h3>
  <ul>
    {% for p in latest_posts %}
      <li><a href="{% url 'post_detail' p.id %}">{{ p.title|truncatechars:30 }}</a></li>
    {% empty %}
      <li>Chưa có bài viết.</li>
    {% endfor %}
  </ul>
</section>

<!-- Tags -->
{% if tags %}
<section class="widget">
  <h3>Thẻ nội dung</h3>
  <ul class="tag-list">
    {% for tag in tags %}
      <li><a href="{% url 'posts_by_tag' tag.id %}" class="tag-pill">{{ tag.name }}</a></li>
    {% endfor %}
  </ul>
</section>
{% endif %}
