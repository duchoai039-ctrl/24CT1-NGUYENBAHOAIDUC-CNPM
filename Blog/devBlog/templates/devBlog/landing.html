{% extends 'devBlog/base.html' %}
{% load static %}

{% block title %}Chào mừng đến với Perspect{% endblock %}
{% block body_class %}landing-page-active{% endblock %}

{% block content %}
<section class="fullscreen-landing">
  <!-- Video nền 720p (~1 MB, faststart: phát được khi mới tải một phần); poster hiện ngay trong lúc chờ -->
  <video
    class="fullscreen-landing-video"
    autoplay
    muted
    loop
    playsinline
    poster="{% static 'videos/hero-poster.jpg' %}"
  >
    <source src="{% static 'videos/hero.mp4' %}" type="video/mp4">
  </video>
  <div class="fullscreen-landing-overlay"></div>

  <!-- Nội dung trung tâm -->
  <div class="fullscreen-landing-center">
    <h1 class="fullscreen-landing-title">Chào mừng bạn đến với Perspect</h1>
    <p class="fullscreen-landing-subtitle">nơi chia sẻ góc nhìn cuộc sống</p>
    <a href="{% url 'login' %}" class="fullscreen-landing-btn">
      <span>Khám phá ngay</span>
      <i class="fa-solid fa-arrow-right"></i>
    </a>
  </div>
</section>
{% endblock %}
