{% extends 'devBlog/base.html' %}

{% block title %}Đăng nhập - Perspect{% endblock %}

{% block content %}
<div class="auth">
  <h1 class="page-title">Đăng nhập</h1>
  {% if error %}
    <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="POST" class="stack-form">
    {% csrf_token %}
    <div class="field">
      <label for="ident">Gmail hoặc số điện thoại</label>
      <input type="text" name="ident" id="ident" value="{{ ident|default:'' }}" autocomplete="username" autocapitalize="none" spellcheck="false" required />
    </div>
    <div class="field">
      <label for="password">Mật khẩu</label>
      <input type="password" name="password" id="password" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn btn-block">Đăng nhập</button>
  </form>
  <p class="auth-switch">Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký</a></p>
</div>
{% endblock %}
