{# Nút thích + số bình luận của một bài trong danh sách (dùng trong _post_item.html) #}
<span class="post-actions">
  <form method="POST" action="{% url 'like_post' post.id %}" class="inline-form like-form">
    {% csrf_token %}
    <button type="submit" class="like-btn{% if post.is_liked %} is-liked{% endif %}"
            aria-pressed="{% if post.is_liked %}true{% else %}false{% endif %}"
            title="{% if post.is_liked %}Bỏ thích{% else %}Thích{% endif %}">
      <i class="fa-{% if post.is_liked %}solid{% else %}regular{% endif %} fa-heart" aria-hidden="true"></i>
      <span><span class="like-count">{{ post.n_likes }}</span><span class="visually-hidden"> lượt thích</span></span>
    </button>
  </form>
  <a href="{% url 'post_detail' post.id %}#binh-luan" class="comment-count" title="Bình luận">
    <i class="fa-regular fa-comment" aria-hidden="true"></i>
    <span>{{ post.n_comments }}<span class="visually-hidden"> bình luận</span></span>
  </a>
</span>
